name: classificador-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD:?Defina POSTGRES_DB no ambiente de producao}
      POSTGRES_USER: ${POSTGRES_USER_PROD:?Defina POSTGRES_USER no ambiente de producao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:?Defina POSTGRES_PASSWORD no ambiente de producao}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - prod-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: classificador-contabil:${APP_IMAGE_TAG_PROD:-prod}
    volumes:
      - razao-temp-prod:/app/data/razao-temporario
      - technical-logs-api-prod:/app/data/logs
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL_PROD:?Defina DATABASE_URL no ambiente de producao}
      ADMIN_TOKEN: ${ADMIN_TOKEN_PROD:?Defina ADMIN_TOKEN no ambiente de producao}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY_PROD:?Defina JWT_SECRET_KEY no ambiente de producao}
      JWT_ALGORITHM: ${JWT_ALGORITHM_PROD:-HS256}
      SERVICE_CREDENTIAL_SECRET: ${SERVICE_CREDENTIAL_SECRET_PROD:?Defina SERVICE_CREDENTIAL_SECRET no ambiente de producao}
      TECHNICAL_LOG_DIR: ${TECHNICAL_LOG_DIR_PROD:-/app/data/logs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://classificador.interno}
      RAZAO_STORAGE_DIR: /app/data/razao-temporario
      RAZAO_UPLOAD_MAX_BYTES: ${RAZAO_UPLOAD_MAX_BYTES_PROD:-50000000}
      RAZAO_STORAGE_MIN_FREE_BYTES: ${RAZAO_STORAGE_MIN_FREE_BYTES_PROD:-5000000000}
      RAZAO_STORAGE_MIN_FREE_RATIO: ${RAZAO_STORAGE_MIN_FREE_RATIO_PROD:-0.15}
      RAZAO_FAILED_RETENTION_SECONDS: ${RAZAO_FAILED_RETENTION_SECONDS_PROD:-86400}
      RAZAO_IMPORT_BLOCK_SIZE: ${RAZAO_IMPORT_BLOCK_SIZE_PROD:-1000}
      RAZAO_WORKER_CONCURRENCY: ${RAZAO_WORKER_CONCURRENCY_PROD:-1}
      RAZAO_HEARTBEAT_SECONDS: ${RAZAO_HEARTBEAT_SECONDS_PROD:-30}
      RAZAO_LEASE_SECONDS: ${RAZAO_LEASE_SECONDS_PROD:-600}
      RAZAO_POLL_INTERVAL_SECONDS: ${RAZAO_POLL_INTERVAL_SECONDS_PROD:-3}
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-db
      - prod-edge
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'online'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  razao-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: classificador-contabil:${APP_IMAGE_TAG_PROD:-prod}
    volumes:
      - razao-temp-prod:/app/data/razao-temporario
      - technical-logs-worker-prod:/app/data/logs
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL_PROD:?Defina DATABASE_URL no ambiente de producao}
      TECHNICAL_LOG_DIR: ${TECHNICAL_LOG_DIR_PROD:-/app/data/logs}
      RAZAO_STORAGE_DIR: /app/data/razao-temporario
      RAZAO_UPLOAD_MAX_BYTES: ${RAZAO_UPLOAD_MAX_BYTES_PROD:-50000000}
      RAZAO_STORAGE_MIN_FREE_BYTES: ${RAZAO_STORAGE_MIN_FREE_BYTES_PROD:-5000000000}
      RAZAO_STORAGE_MIN_FREE_RATIO: ${RAZAO_STORAGE_MIN_FREE_RATIO_PROD:-0.15}
      RAZAO_FAILED_RETENTION_SECONDS: ${RAZAO_FAILED_RETENTION_SECONDS_PROD:-86400}
      RAZAO_IMPORT_BLOCK_SIZE: ${RAZAO_IMPORT_BLOCK_SIZE_PROD:-1000}
      RAZAO_WORKER_CONCURRENCY: ${RAZAO_WORKER_CONCURRENCY_PROD:-1}
      RAZAO_HEARTBEAT_SECONDS: ${RAZAO_HEARTBEAT_SECONDS_PROD:-30}
      RAZAO_LEASE_SECONDS: ${RAZAO_LEASE_SECONDS_PROD:-600}
      RAZAO_POLL_INTERVAL_SECONDS: ${RAZAO_POLL_INTERVAL_SECONDS_PROD:-3}
    command: python -m scripts.razao_worker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - prod-edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  prod-db:
    internal: true
  prod-edge:
    external: true
    name: classificador-prod-edge

volumes:
  postgres-prod-data:
    name: classificador-prod-postgres-data
  razao-temp-prod:
    name: classificador-prod-razao-temp
  technical-logs-api-prod:
    name: classificador-prod-technical-logs-api
  technical-logs-worker-prod:
    name: classificador-prod-technical-logs-worker
