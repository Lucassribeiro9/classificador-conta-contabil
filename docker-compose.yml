version: "2.4"

services:
  api-contabil:
    build: .
    image: classificador-contabil:${APP_IMAGE_TAG:-dev}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - razao-temp-dev:/app/data/razao-temporario
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - SERVICE_CREDENTIAL_SECRET=${SERVICE_CREDENTIAL_SECRET}
      - RAZAO_STORAGE_DIR=/app/data/razao-temporario
      - RAZAO_UPLOAD_MAX_BYTES=${RAZAO_UPLOAD_MAX_BYTES:-50000000}
      - RAZAO_STORAGE_MIN_FREE_BYTES=${RAZAO_STORAGE_MIN_FREE_BYTES:-5000000000}
      - RAZAO_STORAGE_MIN_FREE_RATIO=${RAZAO_STORAGE_MIN_FREE_RATIO:-0.15}
      - RAZAO_FAILED_RETENTION_SECONDS=${RAZAO_FAILED_RETENTION_SECONDS:-86400}
      - RAZAO_IMPORT_BLOCK_SIZE=${RAZAO_IMPORT_BLOCK_SIZE:-1000}
      - RAZAO_WORKER_CONCURRENCY=${RAZAO_WORKER_CONCURRENCY:-1}
      - RAZAO_HEARTBEAT_SECONDS=${RAZAO_HEARTBEAT_SECONDS:-30}
      - RAZAO_LEASE_SECONDS=${RAZAO_LEASE_SECONDS:-600}
      - RAZAO_POLL_INTERVAL_SECONDS=${RAZAO_POLL_INTERVAL_SECONDS:-3}
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network-test

  razao-worker:
    build: .
    image: classificador-contabil:${APP_IMAGE_TAG:-dev}
    volumes:
      - razao-temp-dev:/app/data/razao-temporario
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RAZAO_STORAGE_DIR=/app/data/razao-temporario
      - RAZAO_UPLOAD_MAX_BYTES=${RAZAO_UPLOAD_MAX_BYTES:-50000000}
      - RAZAO_STORAGE_MIN_FREE_BYTES=${RAZAO_STORAGE_MIN_FREE_BYTES:-5000000000}
      - RAZAO_STORAGE_MIN_FREE_RATIO=${RAZAO_STORAGE_MIN_FREE_RATIO:-0.15}
      - RAZAO_FAILED_RETENTION_SECONDS=${RAZAO_FAILED_RETENTION_SECONDS:-86400}
      - RAZAO_IMPORT_BLOCK_SIZE=${RAZAO_IMPORT_BLOCK_SIZE:-1000}
      - RAZAO_WORKER_CONCURRENCY=${RAZAO_WORKER_CONCURRENCY:-1}
      - RAZAO_HEARTBEAT_SECONDS=${RAZAO_HEARTBEAT_SECONDS:-30}
      - RAZAO_LEASE_SECONDS=${RAZAO_LEASE_SECONDS:-600}
      - RAZAO_POLL_INTERVAL_SECONDS=${RAZAO_POLL_INTERVAL_SECONDS:-3}
    command: python -m scripts.razao_worker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network-test
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - n8n-network-test

  n8n-test:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

      API_URL: http://api-contabil:8000

      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678

      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}

    restart: unless-stopped
    networks:
      - n8n-network-test

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - n8n-test
    networks:
      - n8n-network-test

networks:
  n8n-network-test:
    driver: bridge

volumes:
  postgres-data:
  razao-temp-dev:
    name: ${RAZAO_TEMP_VOLUME_NAME:-classificador-dev-razao-temp}
