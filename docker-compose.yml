version: "2.4"

services:
  api-contabil:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Set DATABASE_URL in your .env or system environment, e.g.: 

      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - SERVICE_CREDENTIAL_SECRET=${SERVICE_CREDENTIAL_SECRET}
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network-test

  postgres:
    image: postgres:16-alpine
    environment:
      # Use environment variables (set in .env or system env). Example .env entries:
      
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - n8n-network-test
  
  n8n-test:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      API_URL: http://api-contabil:8000

      # atrás do ngrok (TLS termina no ngrok; upstream é http)
      N8N_SECURE_COOKIE: "false"
      N8N_PROXY_HOPS: "1"

      # bind correto dentro do container
      N8N_HOST: 0.0.0.0
      N8N_PROTOCOL: http
      N8N_PORT: 5678

      # URL pública do ngrok (pra webhooks e links do editor)
      WEBHOOK_URL: ${WEBHOOK_URL}

    restart: unless-stopped
    networks:
      - n8n-network-test

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "http://n8n-test:5678"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN}
    ports:
      - "4040:4040"
    restart: unless-stopped
    depends_on:
      - n8n-test
    networks:
      - n8n-network-test

networks:
  n8n-network-test:
    driver: bridge

volumes:
  postgres-data:
