name: classificador-hml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_HML:?Defina POSTGRES_DB_HML no ambiente de homologacao}
      POSTGRES_USER: ${POSTGRES_USER_HML:?Defina POSTGRES_USER_HML no ambiente de homologacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_HML:?Defina POSTGRES_PASSWORD_HML no ambiente de homologacao}
    volumes:
      - postgres-hml-data:/var/lib/postgresql/data
    networks:
      - hml-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: classificador-contabil:${APP_IMAGE_TAG_HML:-hml}
    volumes:
      - ./tests/fixtures/homologacao:/app/tests/fixtures/homologacao:ro
      - razao-temp-hml:/app/data/razao-temporario
      - technical-logs-api-hml:/app/data/logs
    environment:
      APP_ENV: hml
      API_ROOT_PATH: /api
      DATABASE_URL: ${DATABASE_URL_HML:?Defina DATABASE_URL_HML no ambiente de homologacao}
      ADMIN_TOKEN: ${ADMIN_TOKEN_HML:?Defina ADMIN_TOKEN_HML no ambiente de homologacao}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY_HML:?Defina JWT_SECRET_KEY_HML no ambiente de homologacao}
      JWT_ALGORITHM: ${JWT_ALGORITHM_HML:-HS256}
      SERVICE_CREDENTIAL_SECRET: ${SERVICE_CREDENTIAL_SECRET_HML:?Defina SERVICE_CREDENTIAL_SECRET_HML no ambiente de homologacao}
      TECHNICAL_LOG_DIR: ${TECHNICAL_LOG_DIR_HML:-/app/data/logs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_HML:-https://classificador-hml.interno}
      RAZAO_STORAGE_DIR: /app/data/razao-temporario
      RAZAO_UPLOAD_MAX_BYTES: ${RAZAO_UPLOAD_MAX_BYTES_HML:-50000000}
      RAZAO_STORAGE_MIN_FREE_BYTES: ${RAZAO_STORAGE_MIN_FREE_BYTES_HML:-5000000000}
      RAZAO_STORAGE_MIN_FREE_RATIO: ${RAZAO_STORAGE_MIN_FREE_RATIO_HML:-0.15}
      RAZAO_FAILED_RETENTION_SECONDS: ${RAZAO_FAILED_RETENTION_SECONDS_HML:-86400}
      RAZAO_IMPORT_BLOCK_SIZE: ${RAZAO_IMPORT_BLOCK_SIZE_HML:-1000}
      RAZAO_WORKER_CONCURRENCY: ${RAZAO_WORKER_CONCURRENCY_HML:-1}
      RAZAO_HEARTBEAT_SECONDS: ${RAZAO_HEARTBEAT_SECONDS_HML:-30}
      RAZAO_LEASE_SECONDS: ${RAZAO_LEASE_SECONDS_HML:-600}
      RAZAO_POLL_INTERVAL_SECONDS: ${RAZAO_POLL_INTERVAL_SECONDS_HML:-3}
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hml-db
      - hml-edge
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'online'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  razao-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: classificador-contabil:${APP_IMAGE_TAG_HML:-hml}
    volumes:
      - razao-temp-hml:/app/data/razao-temporario
      - technical-logs-worker-hml:/app/data/logs
    environment:
      APP_ENV: hml
      DATABASE_URL: ${DATABASE_URL_HML:?Defina DATABASE_URL_HML no ambiente de homologacao}
      TECHNICAL_LOG_DIR: ${TECHNICAL_LOG_DIR_HML:-/app/data/logs}
      RAZAO_STORAGE_DIR: /app/data/razao-temporario
      RAZAO_UPLOAD_MAX_BYTES: ${RAZAO_UPLOAD_MAX_BYTES_HML:-50000000}
      RAZAO_STORAGE_MIN_FREE_BYTES: ${RAZAO_STORAGE_MIN_FREE_BYTES_HML:-5000000000}
      RAZAO_STORAGE_MIN_FREE_RATIO: ${RAZAO_STORAGE_MIN_FREE_RATIO_HML:-0.15}
      RAZAO_FAILED_RETENTION_SECONDS: ${RAZAO_FAILED_RETENTION_SECONDS_HML:-86400}
      RAZAO_IMPORT_BLOCK_SIZE: ${RAZAO_IMPORT_BLOCK_SIZE_HML:-1000}
      RAZAO_WORKER_CONCURRENCY: ${RAZAO_WORKER_CONCURRENCY_HML:-1}
      RAZAO_HEARTBEAT_SECONDS: ${RAZAO_HEARTBEAT_SECONDS_HML:-30}
      RAZAO_LEASE_SECONDS: ${RAZAO_LEASE_SECONDS_HML:-600}
      RAZAO_POLL_INTERVAL_SECONDS: ${RAZAO_POLL_INTERVAL_SECONDS_HML:-3}
    command: python -m scripts.razao_worker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hml-db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hml-edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  hml-db:
    internal: true
  hml-edge:
    external: true
    name: classificador-hml-edge

volumes:
  postgres-hml-data:
    name: classificador-hml-postgres-data
  razao-temp-hml:
    name: classificador-hml-razao-temp
  technical-logs-api-hml:
    name: classificador-hml-technical-logs-api
  technical-logs-worker-hml:
    name: classificador-hml-technical-logs-worker
